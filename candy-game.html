<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>糖果標籤大挑戰</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#2b1b4d;
  font-family:"Microsoft JhengHei","微軟正黑體","PingFang HK","Noto Sans TC","Noto Sans CJK TC",sans-serif;
  user-select:none;-webkit-user-select:none}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;
  background:linear-gradient(180deg,#ffe9f3 0%,#fff6e8 100%);color:#3b2a66}
.screen{position:absolute;inset:0;display:none}
.screen.active{display:flex}

/* ---------- buttons ---------- */
.btn{font-family:inherit;font-weight:900;font-size:28px;color:#fff;border:none;cursor:pointer;
  height:64px;min-width:190px;padding:0 32px;border-radius:32px;
  box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s,filter .2s}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn:disabled{background:#c9c3d6!important;color:#f4f1fa;cursor:not-allowed;box-shadow:0 6px 0 #aaa3bd}
.b-orange{background:#ff8a2a}.b-purple{background:#8a5cf0}.b-green{background:#2fb765}
.b-gray{background:#7b88a8}.b-pink{background:#ff5fa2}
.btn.big{height:84px;font-size:40px;min-width:300px;border-radius:42px}

/* ---------- start / end ---------- */
.shop{flex-direction:column;align-items:center;
  background:
   linear-gradient(180deg,#ffd9ea 0,#ffeef6 60%,#fff2dd 60%,#ffe2b8 100%)}
.awning{position:absolute;left:0;right:0;top:0;height:92px;
  background:repeating-linear-gradient(90deg,#ff6fa5 0 80px,#fff 80px 160px);
  border-bottom:10px solid #e04f8a;
  -webkit-mask:radial-gradient(circle 40px at 40px 100%,transparent 0,transparent 0) ;}
.awning::after{content:"";position:absolute;left:0;right:0;bottom:-30px;height:30px;
  background:repeating-linear-gradient(90deg,#ff6fa5 0 80px,#fff 80px 160px);
  -webkit-mask:radial-gradient(circle 40px at 40px 0,#000 39px,transparent 40px) 0 0/80px 30px repeat-x;
          mask:radial-gradient(circle 40px at 40px 0,#000 39px,transparent 40px) 0 0/80px 30px repeat-x;}
.shelf{position:absolute;height:14px;background:#b9783f;border-radius:7px;box-shadow:0 6px 0 #8f5a2c}
.jar{position:absolute;width:64px;height:78px;border-radius:14px 14px 20px 20px;border:4px solid rgba(255,255,255,.9);
  background:linear-gradient(180deg,rgba(255,255,255,.7),var(--j));}
.jar::before{content:"";position:absolute;left:-4px;right:-4px;top:-14px;height:14px;border-radius:6px;background:#fff}
.jar::after{content:"";position:absolute;left:10px;right:10px;top:22px;bottom:12px;border-radius:50%;
  background:repeating-linear-gradient(45deg,var(--j2) 0 8px,#fff 8px 16px);opacity:.85}
.lolli{position:absolute;width:46px;height:46px;border-radius:50%;
  background:repeating-conic-gradient(var(--a) 0 30deg,#fff 30deg 60deg);border:3px solid #fff}
.lolli::after{content:"";position:absolute;left:19px;top:44px;width:6px;height:44px;background:#fff;border-radius:3px;box-shadow:0 0 0 1px #e7d5e0}
.signboard{position:absolute;top:118px;left:50%;transform:translateX(-50%);padding:6px 34px;border-radius:20px;
  background:#fff;border:5px solid #ff6fa5;font-size:30px;font-weight:900;color:#e04f8a;letter-spacing:6px}
.title{position:absolute;top:190px;left:0;right:0;text-align:center;font-size:96px;font-weight:900;letter-spacing:6px;
  color:#fff;-webkit-text-stroke:0;text-shadow:0 6px 0 #8a5cf0,0 0 0 #8a5cf0,4px 4px 0 #8a5cf0,-4px 4px 0 #8a5cf0,
  4px -4px 0 #8a5cf0,-4px -4px 0 #8a5cf0,0 12px 18px rgba(80,40,140,.3)}
.sub{position:absolute;top:332px;left:0;right:0;text-align:center;font-size:36px;font-weight:800;color:#6a3fc8}
.counter{position:absolute;left:0;right:0;bottom:0;height:150px;background:#c98a4c;border-top:14px solid #e3a766}
.startchars{position:absolute;left:0;right:0;bottom:120px;display:flex;justify-content:center;align-items:flex-end;gap:140px}
.startchars svg,.endchars svg{overflow:visible}
.start-btn-wrap{position:absolute;left:0;right:0;bottom:28px;display:flex;justify-content:center}
.bob{animation:bob 2.4s ease-in-out infinite}
.bob2{animation:bob 2s ease-in-out .3s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* ---------- game screen ---------- */
#game{flex-direction:column;padding:10px 28px 14px}
.topbar{height:48px;display:flex;align-items:center;justify-content:space-between;flex:none}
.pill{background:#8a5cf0;color:#fff;font-size:28px;font-weight:900;padding:2px 28px;border-radius:26px;height:46px;line-height:46px}
.dots{display:flex;gap:12px;align-items:center}
.dot{width:22px;height:22px;border-radius:50%;background:#e1d6f7;border:3px solid #fff}
.dot.on{background:#ff8a2a}.dot.done{background:#2fb765}
.fsbtn{height:44px;min-width:0;font-size:22px;padding:0 22px;border-radius:22px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.qrow{flex:none;height:68px;display:flex;align-items:center;justify-content:center;gap:16px;margin-top:6px}
.qrow svg{flex:none}
.q{font-size:42px;font-weight:900;color:#3b2a66;line-height:1.2;text-align:center}
.numrow{flex:none;height:80px;display:flex;justify-content:center;align-items:center}
.bignum{min-width:160px;height:72px;line-height:64px;text-align:center;font-size:62px;font-weight:900;color:#fff;
  background:#ff5fa2;border-radius:42px;border:6px solid #fff;box-shadow:0 6px 0 #d63d85}
.content{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;position:relative}
.strip{flex:none;height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.hint{font-size:30px;font-weight:800;color:#7a6aa8}
.raise{font-size:60px;font-weight:900;color:#ff6a00;animation:pulse 1s ease-in-out infinite;text-shadow:0 3px 0 #fff}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.ans1{font-size:40px;font-weight:900;color:#1c9a4e}
.ans-row{display:flex;gap:18px}
.chip{font-size:30px;font-weight:800;color:#3b2a66;background:#fff;border:4px solid #8a5cf0;border-radius:24px;padding:2px 24px}
.controls{flex:none;height:78px;display:flex;justify-content:center;align-items:center;gap:26px}

/* ---------- bags & cubes ---------- */
.bags{display:flex;gap:56px;align-items:flex-start}
.bagwrap{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.baglabel{font-size:34px;font-weight:900;color:#fff;background:#8a5cf0;border-radius:24px;padding:0 30px;height:44px;line-height:44px}
.bag{position:relative;background:linear-gradient(180deg,#fff7ea,#ffe9cf);border:6px solid #d9b38a;border-radius:22px 22px 30px 30px;
  padding:26px 26px 16px;box-shadow:0 8px 0 rgba(0,0,0,.12);transition:border-color .3s,box-shadow .3s}
.bag::before{content:"";position:absolute;left:14px;right:14px;top:-4px;height:14px;border-radius:8px;
  background:repeating-linear-gradient(90deg,#ff6fa5 0 14px,#fff 14px 28px)}
.bag.correct{border-color:#22b45a;box-shadow:0 0 0 8px rgba(34,180,90,.35),0 8px 0 rgba(0,0,0,.12)}
.bag .inner{display:flex;flex-direction:row;align-items:flex-end;gap:var(--bg)}
.bag.stack{width:310px;padding:20px 12px 12px;border-width:5px}
.bag.stack .inner{justify-content:center}
.rods{display:flex;flex-direction:row;align-items:flex-end;gap:var(--rg)}
.rod{display:flex;flex-direction:column;padding-top:var(--s)}
.ones{display:flex;flex-direction:row;align-items:flex-end;gap:var(--og)}
.ocol{display:flex;flex-direction:column;justify-content:flex-end;gap:calc(var(--s) + 3px);padding-top:var(--s)}
.gap-line{align-self:stretch;width:0;border-left:4px dotted #c9b6e8}
/* 立體正方體：正面 + 右側面 + 頂面 */
.cube{position:relative;display:block;width:var(--c);height:var(--c);flex:none;margin-right:var(--s);
  background:var(--sp),linear-gradient(135deg,rgba(255,255,255,.35),rgba(255,255,255,0) 55%),var(--f);border:1.5px solid var(--d);border-radius:2px}
.cube::after{content:"";position:absolute;left:100%;top:-2px;width:var(--s);height:calc(100% + 4px);
  background:var(--sp),var(--sd);border:1.5px solid var(--d);border-left:none;transform-origin:0 0;transform:skewY(-45deg)}
.ocol .cube::before,.rod .cube:first-child::before{content:"";position:absolute;left:-2px;bottom:100%;width:calc(100% + 4px);height:var(--s);
  background:var(--sp),var(--t);border:1.5px solid var(--d);border-bottom:none;transform-origin:0 100%;transform:skewX(-45deg);margin-bottom:0}
.cube,.cube::before,.cube::after{--sp:radial-gradient(circle,rgba(255,255,255,.95) 0 1px,transparent 1.5px) 0 0/6px 6px,radial-gradient(circle,rgba(255,255,255,.8) 0 .8px,transparent 1.3px) 3px 2px/8px 8px}
.c0{--f:#f0489a;--t:#ff8cc4;--sd:#c42d7c;--d:#8f1b58}
.c1{--f:#a24be0;--t:#cf90f5;--sd:#7a2fb5;--d:#501d80}
.c2{--f:#f59a3a;--t:#ffc27d;--sd:#cc7618;--d:#8f4c0d}
.c3{--f:#7fd23c;--t:#b5ec7c;--sd:#5da824;--d:#386812}
.c4{--f:#ffd93a;--t:#ffeb85;--sd:#d9b11a;--d:#9a7a0c}
.rods-lg{--c:30px;--s:9px;--rg:12px;--og:12px;--bg:44px}
.rods-sm{--c:20px;--s:6px;--rg:9px;--og:9px;--bg:28px}
.rods-lg .rod,.rods-lg .ocol{}
.rods-lg .gap-line,.rods-sm .gap-line{border-left-width:3px}
/* 第2、3關：袋 + 標籤並排 */
.sidewrap{display:flex;align-items:center;gap:64px}
.tagcol{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:240px}

/* tags */

.tag{position:relative;min-width:150px;height:78px;background:#fff;border:5px solid #8a5cf0;border-radius:14px 14px 14px 14px;
  display:flex;align-items:baseline;justify-content:center;gap:4px;padding:0 22px;line-height:68px;
  font-size:58px;font-weight:900;color:#3b2a66;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.tag::before{content:"";position:absolute;left:-14px;top:50%;margin-top:-9px;width:18px;height:18px;border-radius:50%;background:#ffe9f3;border:5px solid #8a5cf0}
.tag small{font-size:30px}
.tag.wrong{border-color:#e03a3a}
.tag.wrong b{opacity:.55}
.tag.wrong .x{position:absolute;inset:-14px -10px;pointer-events:none}
.tag.right{border-color:#22b45a;background:#eafff0;animation:pop .5s ease-out}
.arrow{font-size:52px;color:#22b45a;font-weight:900;animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}

/* effects */
.fx{position:absolute;pointer-events:none;z-index:5}
.star{position:absolute;animation:starpop 1.6s ease-out forwards;opacity:0}
@keyframes starpop{0%{transform:scale(0) rotate(0);opacity:0}30%{opacity:1}60%{transform:scale(1.2) rotate(180deg);opacity:1}100%{transform:scale(1) rotate(360deg) translateY(-14px);opacity:0}}
.confetti{position:absolute;top:-30px;width:14px;height:22px;animation:fall linear forwards;z-index:20;pointer-events:none}
@keyframes fall{to{transform:translateY(780px) rotate(720deg)}}

/* end */
.endtxt{position:absolute;top:70px;left:0;right:0;text-align:center}
.endtxt h1{font-size:68px;font-weight:900;color:#fff;letter-spacing:3px;
  text-shadow:0 5px 0 #8a5cf0,4px 4px 0 #8a5cf0,-4px 4px 0 #8a5cf0,4px -4px 0 #8a5cf0,-4px -4px 0 #8a5cf0}
.endtxt .sum{display:inline-block;margin-top:28px;font-size:42px;font-weight:900;color:#3b2a66;background:#fff;border:6px solid #8a5cf0;border-radius:30px;padding:14px 40px;line-height:1.4}
.endchars{position:absolute;left:0;right:0;bottom:120px;display:flex;justify-content:center;align-items:flex-end;gap:150px}
.thanks{position:absolute;bottom:250px;left:50%;transform:translateX(-50%);display:none}
.cubes{display:block;filter:drop-shadow(2px 3px 2px rgba(60,40,20,.22))}
.bag{background:linear-gradient(180deg,#fff0ea,#fde2d9)!important;border-color:#e2b3a2!important}
.bag.correct{border-color:#22b45a!important}
.bag.stack .inner,.bag.side .inner{justify-content:center}
.bagwrap{transition:transform .5s ease,opacity .5s ease}
.bagwrap.pick{transform:scale(1.04);transform-origin:50% 0;z-index:3}
.bagwrap.pick .baglabel{background:#22b45a;transform:scale(1.2);transform-origin:50% 100%;transition:transform .5s,background .5s}
.bagwrap.dim{opacity:.3}
.note{position:absolute;z-index:6;white-space:nowrap;width:132px;text-align:center;font-size:44px;font-weight:900;color:#fff;line-height:58px;height:62px;
  padding:0 22px;border:4px solid;border-radius:31px;box-shadow:0 5px 0 rgba(0,0,0,.18);animation:pop .5s ease-out both}
.note-arrow{animation:pop .5s ease-out .15s both}
.storyimg{position:absolute;left:50%;top:158px;width:782px;height:440px;margin-left:-391px;border-radius:26px;overflow:hidden;
  border:8px solid #fff;box-shadow:0 10px 0 #c9a3e8,0 18px 30px rgba(80,40,140,.3)}
.storyimg img{display:block;width:100%;height:100%;object-fit:cover}
#startScreen .title{top:8px;font-size:84px}
#startScreen .sub{top:114px;font-size:32px}
#startScreen .start-btn-wrap{bottom:14px}
#startScreen .btn.big{height:76px;font-size:38px}
.cubes{overflow:visible}
.note-g{animation:noteIn .5s ease-out both}
@keyframes noteIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.strip{height:90px!important}
.bag.side{padding:18px 40px 20px!important}
#startScreen{background:linear-gradient(180deg,#ffd9ea 0%,#ffeaf3 45%,#fff1dc 100%)}
#startScreen .title{top:10px;font-size:84px}
#startScreen .sub{top:120px;font-size:32px}
#startScreen .storyimg{top:176px;width:736px;height:414px;margin-left:-368px}
#startScreen .start-btn-wrap{bottom:18px}
#endScreen{background:#f3d9f7}
.endimg{position:absolute;left:0;top:0;width:1280px;height:720px;display:block}
.hotspot{position:absolute;border:none;background:transparent;border-radius:46px;cursor:pointer;transition:box-shadow .15s,transform .1s}
.hotspot:hover{box-shadow:0 0 0 5px rgba(255,255,255,.85),0 0 22px 8px rgba(255,255,255,.55)}
.hotspot:active{transform:translateY(3px)}
.hotspot:focus-visible{outline:4px solid #8a5cf0}
.reading{display:flex;align-items:center;gap:14px;background:#fff;border:5px solid #ff5fa2;border-radius:40px;padding:4px 30px;
  box-shadow:0 5px 0 rgba(0,0,0,.15);animation:pop .5s ease-out;margin-top:8px}
.reading .rl{font-size:32px;font-weight:800;color:#d63d85}
.reading b{font-size:66px;font-weight:900;color:#3b2a66;letter-spacing:6px;line-height:1.15}
.controls{gap:20px!important}
.controls .btn{min-width:170px}
</style>
</head>

<script>
/* ================= 基本工具 ================= */
const $ = id => document.getElementById(id);
const stage = $('stage');

function fit(){
  const s = Math.min(window.innerWidth/1280, window.innerHeight/720);
  stage.style.transform = 'scale('+s+')';
  stage.style.left = ((window.innerWidth-1280*s)/2)+'px';
  stage.style.top  = ((window.innerHeight-720*s)/2)+'px';
}
window.addEventListener('resize', fit); fit();

function toggleFS(){
  if(!document.fullscreenElement){
    (document.documentElement.requestFullscreen||function(){}).call(document.documentElement);
  }else{ document.exitFullscreen(); }
}
$('fsBtn').onclick = toggleFS;
document.addEventListener('fullscreenchange',()=>{
  $('fsBtn').textContent = document.fullscreenElement ? '退出全螢幕' : '全螢幕';
  fit();
});

const DIG = '零一二三四五六七八九';
function zh(n){           // 21–50 的中文讀法
  const t = Math.floor(n/10), o = n%10;
  return DIG[t] + '十' + (o ? DIG[o] : '');
}

/* ================= 怪獸（SVG） ================= */
function monster(kind, w){
  const big = kind==='bobo';
  const body = big ? '#5aa9ff' : '#62d36a';
  const dark = big ? '#3b86d9' : '#3fae48';
  const belly= big ? '#c4e2ff' : '#d3f7d3';
  let fur = '';
  const cx=100, cy=132, rx=72, ry=80, n=20;
  for(let i=0;i<n;i++){
    const a = i/n*Math.PI*2;
    fur += `<circle cx="${(cx+Math.cos(a)*rx).toFixed(1)}" cy="${(cy+Math.sin(a)*ry).toFixed(1)}" r="${big?14:11}" fill="${body}"/>`;
  }
  const horns = big
    ? `<path d="M52 66 L44 28 L76 54 Z" fill="#ffd0e6" stroke="#f08ab8" stroke-width="3" stroke-linejoin="round"/>
       <path d="M148 66 L156 28 L124 54 Z" fill="#ffd0e6" stroke="#f08ab8" stroke-width="3" stroke-linejoin="round"/>`
    : `<line x1="76" y1="62" x2="62" y2="24" stroke="${dark}" stroke-width="6" stroke-linecap="round"/><circle cx="60" cy="20" r="9" fill="#ff8fc0"/>
       <line x1="124" y1="62" x2="138" y2="24" stroke="${dark}" stroke-width="6" stroke-linecap="round"/><circle cx="140" cy="20" r="9" fill="#ff8fc0"/>`;
  const eyes = big
    ? `<circle cx="74" cy="104" r="20" fill="#fff"/><circle cx="126" cy="104" r="20" fill="#fff"/>
       <circle cx="78" cy="106" r="9" fill="#2b2250"/><circle cx="122" cy="106" r="9" fill="#2b2250"/>
       <circle cx="81" cy="102" r="3" fill="#fff"/><circle cx="125" cy="102" r="3" fill="#fff"/>`
    : `<circle cx="78" cy="106" r="24" fill="#fff"/><circle cx="122" cy="106" r="24" fill="#fff"/>
       <circle cx="82" cy="108" r="11" fill="#2b2250"/><circle cx="118" cy="108" r="11" fill="#2b2250"/>
       <circle cx="86" cy="103" r="4" fill="#fff"/><circle cx="122" cy="103" r="4" fill="#fff"/>`;
  return `<svg viewBox="0 0 200 230" width="${w}" height="${w*1.15}" aria-hidden="true">
    <ellipse cx="100" cy="222" rx="62" ry="8" fill="rgba(0,0,0,.14)"/>
    <ellipse cx="68" cy="212" rx="26" ry="12" fill="${dark}"/><ellipse cx="132" cy="212" rx="26" ry="12" fill="${dark}"/>
    <ellipse cx="28" cy="150" rx="18" ry="30" fill="${body}" transform="rotate(25 28 150)"/>
    <ellipse cx="172" cy="150" rx="18" ry="30" fill="${body}" transform="rotate(-25 172 150)"/>
    ${fur}
    <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${body}"/>
    <ellipse cx="100" cy="168" rx="40" ry="36" fill="${belly}"/>
    ${horns}${eyes}
    <path d="M72 138 Q100 168 128 138 Q100 150 72 138 Z" fill="#8a2b4c"/>
    <path d="M82 141 Q100 148 118 141 L118 146 Q100 152 82 146 Z" fill="#fff"/>
    <ellipse cx="50" cy="128" rx="9" ry="6" fill="#ff9bbd" opacity=".7"/><ellipse cx="150" cy="128" rx="9" ry="6" fill="#ff9bbd" opacity=".7"/>
  </svg>`;
}

/* 場景裝飾（糖果罐、棒棒糖） */
function shelfHTML(){
  const jars = [['#ffb3d1','#ff5f95'],['#b9e7ff','#3d93f0'],['#c9f5c9','#33bf63'],['#e3d1ff','#8a5cf0'],['#ffd3a8','#ff8a2a']];
  let h = '';
  [[50,400],[1000,400]].forEach(([x,y],k)=>{
    h += `<div class="shelf" style="left:${x-20}px;top:${y+80}px;width:${230}px"></div>`;
    for(let i=0;i<3;i++){
      const j = jars[(i+k*2)%5];
      h += `<div class="jar" style="left:${x+i*72}px;top:${y}px;--j:${j[0]};--j2:${j[1]}"></div>`;
    }
  });
  const lol = ['#ff5f95','#3d93f0','#33bf63','#8a5cf0'];
  [[150,160],[1090,160],[1180,300]].forEach(([x,y],i)=>{
    h += `<div class="lolli" style="left:${x}px;top:${y}px;--a:${lol[i%4]}"></div>`;
  });
  return h;
}

/* ================= 數粒圖 ================= */
/* 課本風格立體數粒（SVG）：正面 + 右側面 + 頂面，全部淺綠色 */
function sq(x,y,c,d,top){
  let t='';
  t+=`<rect x="${x}" y="${y}" width="${c}" height="${c}" fill="#b9d93f"/>`;
  t+=`<polygon points="${x+c},${y} ${x+c+d},${y-d} ${x+c+d},${y+c-d} ${x+c},${y+c}" fill="#8db02c"/>`;
  if(top) t+=`<polygon points="${x},${y} ${x+d},${y-d} ${x+c+d},${y-d} ${x+c},${y}" fill="#d6ee7a"/>`;
  // 描邊與高光
  t+=`<g fill="none" stroke="#2c3b0d" stroke-width="1.2" stroke-linejoin="round">
        <rect x="${x}" y="${y}" width="${c}" height="${c}"/>
        <polygon points="${x+c},${y} ${x+c+d},${y-d} ${x+c+d},${y+c-d} ${x+c},${y+c}"/>
        ${top?`<polygon points="${x},${y} ${x+d},${y-d} ${x+c+d},${y-d} ${x+c},${y}"/>`:''}
      </g>
      <path d="M${x+2.2} ${y+c-2.4} V${y+2.2} H${x+c-2.4}" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1.3" stroke-linecap="round"/>`;
  return `<g class="sq">${t}</g>`;
}
function drawBag(rods, ones, c, d, T=0){
  const rg=Math.round(c*.5), gg=Math.round(c*1.6), og=Math.round(c*.5), vg=d+Math.max(3,Math.round(c*.12));
  const H=T+10*c+d+4, base=H-2, rodW=c+d;
  const rodsW=rods*rodW+(rods-1)*rg, ncols=Math.ceil(ones/5);
  const onesW=ncols*rodW+(ncols-1)*og;
  const W=2+rodsW+(ones>0?gg+onesW:0)+2;
  let g='<g class="rods">';
  for(let r=0;r<rods;r++){                                   // 每條恰好10粒
    const x=2+r*(rodW+rg); let col='';
    for(let k=0;k<10;k++) col+=sq(x, base-10*c+k*c, c, d, k===0);
    g+=`<g class="rod">${col}</g>`;
  }
  g+='</g><g class="ones">';
  let left=ones;
  for(let j=0;j<ncols;j++){                                  // 單粒：每行最多5粒，底部對齊
    const n=Math.min(5,left); left-=n;
    const x=2+rodsW+gg+j*(rodW+og); let col='';
    for(let i=0;i<n;i++) col+=sq(x, base-c-i*(c+vg), c, d, true);
    g+=`<g class="ocol">${col}</g>`;
  }
  g+='</g>';
  const ot = ones>0 ? base-c-(Math.min(ones,5)-1)*(c+vg)-d : 0;
  return `<svg class="cubes" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true" data-rx="2" data-rw="${rodsW}" data-ox="${2+rodsW+gg}" data-ow="${onesW}" data-ot="${ot}" data-rt="${base-10*c-d}" data-h="${H}">${g}</svg>`;
}
function bagHTML(rods, ones, mode){
  const svg = mode==='stack' ? drawBag(rods,ones,26,9) : drawBag(rods,ones,26,9,80);
  return `<div class="bag ${mode}"><div class="inner">${svg}</div></div>`;
}

/* ================= 關卡資料 ================= */
const LEVELS = [
 { who:'bobo', q:'波波想準備43粒糖果，哪一袋才是正確的呢？', target:43,
   bags:[{id:'A',rods:3,ones:4},{id:'B',rods:4,ones:3},{id:'C',rods:4,ones:5}],
   answer:'B', hint:'請在答題紙上寫下 A、B 或 C' },
 { who:'doudou', q:'豆豆發現這袋糖果標示為48粒，標籤正確嗎？', rods:3, ones:8, label:48,
   hint:'請在答題紙上寫下正確的數字' },
 { who:'bobo', q:'波波準備好最後一袋糖果，請幫忙填上正確的數字！', rods:4, ones:7, label:null,
   hint:'請數一數，在答題紙上寫下糖果總數' }
];

let cur = 0, phase = 0, readDone = false;   // phase 0=題目 1=已舉起 2=已揭曉

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
}

function renderLevel(){
  const L = LEVELS[cur];
  phase = 0; readDone = false;
  $('levelPill').textContent = `第${cur+1}關／共3關`;
  $('dots').innerHTML = LEVELS.map((_,i)=>`<span class="dot ${i<cur?'done':i===cur?'on':''}"></span>`).join('');
  $('qAvatar').innerHTML = monster(L.who, 60);
  $('qText').textContent = L.q;
  $('strip').innerHTML = `<div class="hint">${L.hint}</div>`;
  document.querySelectorAll('.confetti').forEach(e=>e.remove());

  if(cur===0){
    $('numRow').style.display='none';
    $('content').innerHTML = `<div class="bags">` + L.bags.map(b =>
      `<div class="bagwrap" data-id="${b.id}"><div class="baglabel">${b.id}袋</div>${bagHTML(b.rods,b.ones,'stack')}</div>`
    ).join('') + `</div>`;
  } else {
    $('numRow').style.display='none';
    const tag = (L.label===null)
      ? `<div class="tag" id="tag"><b>？</b><small>粒</small></div>`
      : `<div class="tag" id="tag"><b>${L.label}</b><small>粒</small></div>`;
    $('content').innerHTML = `<div class="sidewrap">${bagHTML(L.rods,L.ones,'side')}<div class="tagcol" id="tagRow">${tag}</div></div>`;
  }
  $('nextBtn').textContent = cur===LEVELS.length-1 ? '完成挑戰' : '下一關';
  selfCheck();
  updateButtons();
}

function updateButtons(){
  $('retryBtn').disabled  = (phase===0);
  $('raiseBtn').disabled  = (phase!==0);
  $('revealBtn').disabled = (phase!==1);
  $('nextBtn').disabled   = (phase!==2) || (cur>0 && !readDone);
  $('readBtn').style.display = (cur===0) ? 'none' : '';
  $('readBtn').disabled   = (phase!==2 || readDone);
}

function raise(){
  if(phase!==0) return;
  phase = 1;
  $('strip').innerHTML = `<div class="raise">請舉起你的答題紙！</div>`;
  updateButtons();
}

function reveal(){
  if(phase!==1) return;
  phase = 2;
  const L = LEVELS[cur];
  let line1, total, rods, ones;
  if(cur===0){
    const b = L.bags.find(x=>x.id===L.answer);
    rods=b.rods; ones=b.ones; total=rods*10+ones;
    line1 = `答對了！${b.id}袋有${total}粒糖果！`;
    const w = document.querySelector(`.bagwrap[data-id="${b.id}"]`);
    w.querySelector('.bag').classList.add('correct');
    w.classList.add('pick');
    document.querySelectorAll('.bagwrap').forEach(x=>{ if(x!==w) x.classList.add('dim'); });
    addStars(w);
  } else {
    rods=L.rods; ones=L.ones; total=rods*10+ones;
    if(cur===1){
      const tag = $('tag');
      tag.classList.add('wrong');
      tag.insertAdjacentHTML('beforeend',
        `<svg class="x" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M8 10 L92 90 M92 10 L8 90" stroke="#e03a3a" stroke-width="9" stroke-linecap="round" fill="none"/></svg>`);
      $('tagRow').insertAdjacentHTML('beforeend',
        `<span class="arrow">▼</span><div class="tag right"><b>${total}</b><small>粒</small></div>`);
      line1 = `標籤錯了！正確是${total}粒！`;
    } else {
      const tag = $('tag');
      tag.classList.add('right');
      tag.innerHTML = `<b>${total}</b><small>粒</small>`;
      line1 = `完成！這袋有${total}粒糖果！`;
      confetti();
    }
  }
  $('strip').innerHTML = `<div class="ans1" style="font-size:56px">${line1}</div>`;
  if(cur>0) addNotes(rods, ones);
  updateButtons();
}

/* 揭曉後：用括號精準框住整條數粒和單粒，並標示「幾條」「幾粒」 */
function addNotes(rods, ones){
  const svg=document.querySelector('#content svg.cubes'), d=svg.dataset;
  const ns='http://www.w3.org/2000/svg';
  const font='Microsoft JhengHei,PingFang HK,Noto Sans TC,sans-serif';
  const brace=(x0,x1,yb,col,dark,label)=>{
    const xm=(x0+x1)/2, r=10, w=116, h=54, bx=xm-w/2, by=yb-9-8-h;
    return `<path d="M${x0} ${yb+11} Q${x0} ${yb} ${x0+r} ${yb} H${xm-r} Q${xm} ${yb} ${xm} ${yb-9} Q${xm} ${yb} ${xm+r} ${yb} H${x1-r} Q${x1} ${yb} ${x1} ${yb+11}"
        fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="${bx}" y="${by+5}" width="${w}" height="${h}" rx="27" fill="${dark}"/>
      <rect x="${bx}" y="${by}" width="${w}" height="${h}" rx="27" fill="${col}" stroke="#fff" stroke-width="3"/>
      <text x="${xm}" y="${by+h/2+1}" text-anchor="middle" dominant-baseline="central" font-size="36" font-weight="900" fill="#fff" font-family="${font}">${label}</text>`;
  };
  let h=brace(+d.rx, +d.rx+ +d.rw, +d.rt-6, '#ff5fa2', '#d63d85', rods+'條');
  if(ones>0) h+=brace(+d.ox, +d.ox+ +d.ow, +d.ot-6, '#2f9bf0', '#1f72b8', ones+'粒');
  const g=document.createElementNS(ns,'g');
  g.setAttribute('class','note-g');
  g.innerHTML=h;
  svg.appendChild(g);
}

function readNumber(){
  if(cur===0 || phase!==2 || readDone) return;
  readDone = true;
  const L = LEVELS[cur], total = L.rods*10 + L.ones;
  $('tagRow').insertAdjacentHTML('beforeend',
    `<div class="reading"><span class="rl">讀作</span><b>${zh(total)}</b></div>`);
  updateButtons();
}

function next(){
  if(phase!==2 || (cur>0 && !readDone)) return;
  if(cur < LEVELS.length-1){ cur++; renderLevel(); }
  else { show('endScreen'); confetti(true); }
}

/* ================= 特效 ================= */
function addStars(wrap){
  const cols = ['#ff5f95','#ff8a2a','#8a5cf0','#33bf63'];
  const pos = [[-26,-8],[300,-8],[-22,150],[312,150]];
  pos.forEach((p,i)=>{
    const s = document.createElement('div');
    s.className='star';
    s.style.cssText = `left:${p[0]+8}px;top:${p[1]+40}px;animation-delay:${i*0.12}s`;
    s.innerHTML = `<svg width="46" height="46" viewBox="0 0 24 24"><path fill="${cols[i%4]}" stroke="#fff" stroke-width="1.2" d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.8-6.3 3.8 1.7-7L2 9.2l7.1-.6z"/></svg>`;
    wrap.appendChild(s);
  });
}
function confetti(onEnd){
  const cols=['#ff5f95','#3d93f0','#33bf63','#8a5cf0','#ff8a2a','#f0524f'];
  for(let i=0;i<36;i++){
    const d=document.createElement('div');
    d.className='confetti';
    d.style.left=(Math.random()*1240)+'px';
    d.style.background=cols[i%cols.length];
    d.style.animationDuration=(1.8+Math.random()*1.4)+'s';
    d.style.animationDelay=(Math.random()*.6)+'s';
    d.style.borderRadius = i%3===0 ? '50%' : '3px';
    stage.appendChild(d);
    setTimeout(()=>d.remove(),4200);
  }
}

/* ================= 數量自我檢查 ================= */
function selfCheck(){
  const expect = (cur===0) ? [34,43,45] : [cur===1?38:47];
  const got = [...document.querySelectorAll('.bag')].map(b=>{
    const rods=[...b.querySelectorAll('.rod')];
    rods.forEach(r=>console.assert(r.querySelectorAll('.sq').length===10,'每條必須有10粒'));
    return rods.length*10 + b.querySelectorAll('.ones .sq').length;
  });
  console.assert(JSON.stringify(got)===JSON.stringify(expect),'數粒數量錯誤',got,expect);
  window.__counts = got;
}

/* ================= 事件 ================= */
$('startBtn').onclick = ()=>{ cur=0; show('game'); renderLevel(); };
$('retryBtn').onclick = ()=>{ renderLevel(); };
$('raiseBtn').onclick = raise;
$('revealBtn').onclick = reveal;
$('nextBtn').onclick = next;
$('readBtn').onclick = readNumber;
document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>b.blur()));
/* 鍵盤快捷：空白鍵／Enter／→ 依次執行「舉起答案」→「揭曉答案」→「下一關」 */
document.addEventListener('keydown',e=>{
  if(!$('game').classList.contains('active')) return;
  if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight'){
    e.preventDefault();
    if(phase===0) raise(); else if(phase===1) reveal(); else if(cur>0 && !readDone) readNumber(); else next();
  }
});
document.addEventListener('keyup',e=>{ if(e.key===' ') e.preventDefault(); });
$('againBtn').onclick = ()=>{ cur=0; document.querySelectorAll('.confetti').forEach(e=>e.remove()); show('startScreen'); };
</script>
</body>
